services:
  # Render Static Site (Recommended for Vite / SPA apps: 100% Free, Global CDN, No sleep)
  - type: static
    name: aashray-disaster-relief
    env: static
    buildCommand: npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
